name: Delfini Lite

# Dogfood + published-ref consumer test for the standalone (Lite) Delfini
# Action, on pull requests carrying the `delfini-lite` label.
#
# Story P3.9.5 cutover: this workflow consumes the Action exactly the way an
# external repo does — `uses: Legends-of-Tech/delfini/apps/action@v0` (the
# monorepo-subdirectory ref at the published moving tag). GitHub fetches the
# repo at the tag and runs action.yml's `main: dist/index.js` directly, so the
# ncc bundle is COMMITTED at the ref (see .gitignore's apps/action/dist
# exception + the release-gate freshness check). No local build/setup steps —
# their absence IS the consumer-path test.
#
# Tag convention: `v0` is the moving major tag for the 0.x line (re-pointed on
# each release); `v1` arrives at 1.0.

on:
  pull_request:
    # `labeled` is required: a PR created with `--label` still fires `opened`
    # before the label is attached, so the run that actually carries the label
    # is the `labeled` event. `synchronize` covers pushes to a labelled PR.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  delfini-lite-action:
    # Runs only on PRs carrying the `delfini-lite` label.
    if: contains(github.event.pull_request.labels.*.name, 'delfini-lite')
    runs-on: ubuntu-latest
    steps:
      - name: Run Delfini (Lite mode) — published subdirectory ref
        uses: Legends-of-Tech/delfini/apps/action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: anthropic
          LLM_MODEL: claude-opus-4-7
          # The action is standalone by design: it hard-fails if a Delfini
          # workspace token is supplied (see apps/action/action.yml).
        with:
          # Smoke-doc scope: point at the repo docs the smoke PR perturbs.
          doc_scope: docs
          enforcement: warning
